[project]
name = "multisizer"
version = "0.1.0"
description = "Parse Beckman Coulter Multisizer 3 (.#M3) and Z2 AccuComp (.=#Z2) data files"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "William Mallard", email = "wjm@llard.net" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/wjmallard/multisizer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multisizer"]
